[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcedesk-document-assistant"
version = "1.0.0"
description = "A document Q&A portfolio project with page citations, offline search, and optional semantic RAG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6.10,<7",
  "scikit-learn>=1.6,<2",
  "numpy>=2,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=5,<6", "faiss-cpu>=1.9,<2"]
llm = ["langchain-openai>=1,<2"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]
samples = ["reportlab>=4,<5"]

[tool.setuptools.packages.find]
include = ["docassist*"]

[tool.setuptools.package-data]
docassist = ["static/*", "samples/*.pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
